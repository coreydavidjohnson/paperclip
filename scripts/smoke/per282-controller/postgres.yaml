apiVersion: v1
kind: Pod
metadata:
  name: database
  namespace: per282-controller-78e0d9fb
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 3000
  automountServiceAccountToken: false
  containers:
  - name: postgres
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    env:
    - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
    - {name: POSTGRES_USER, value: paperclip}
    - {name: POSTGRES_DB, value: paperclip}
    resources:
      requests: {cpu: "100m", memory: "128Mi"}
      limits: {cpu: "1", memory: "1Gi"}
    readinessProbe:
      exec: {command: ["pg_isready", "-U", "paperclip"]}
      initialDelaySeconds: 2
